<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Spy Dossier — first viewport</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1440px;height:900px;overflow:hidden;background:#1a1814;font-family:"IBM Plex Mono",monospace;color:#1a1410}
  .dossier{width:100%;height:100%;background:#c4a574;padding:40px 52px;position:relative}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;height:calc(100% - 120px);margin-top:72px}
  .frame{background:#2a2a28;border:2px solid #0e0a08;position:relative;overflow:hidden}
  .frame.active{outline:3px solid #c41e1e;outline-offset:4px}
  .frame .img{position:absolute;inset:0;background:linear-gradient(145deg,#3a4550,#6a7888);opacity:.85;filter:contrast(1.1) grayscale(.3)}
  .frame .cap{position:absolute;left:10px;bottom:10px;right:10px;color:#f0e6d0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .typed{position:absolute;top:36px;left:52px;font-family:"Special Elite",serif;font-size:36px;color:#0e0a08}
  .typed small{display:block;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px;opacity:.7}
  .stamp{position:absolute;right:64px;top:28px;border:4px solid #c41e1e;color:#c41e1e;font-family:"Special Elite",serif;font-size:28px;padding:10px 18px;transform:rotate(-8deg);letter-spacing:.08em;background:rgba(196,165,116,.85)}
  .stamp span{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;margin-top:4px}
  .reticle{position:absolute;left:38%;top:48%;width:120px;height:120px;border:2px solid #c41e1e;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:.7}
  .reticle::before,.reticle::after{content:"";position:absolute;background:#c41e1e}
  .reticle::before{left:50%;top:-8px;bottom:-8px;width:2px;transform:translateX(-50%)}
  .reticle::after{top:50%;left:-8px;right:-8px;height:2px;transform:translateY(-50%)}
</style>
</head>
<body>
  <div class="dossier">
    <div class="typed">JUAN NICOLAS PIEDRAHITA<small>Full-stack systems · Case file · synthetic</small></div>
    <div class="stamp">CONTACT<span>Email · LinkedIn · GitHub</span></div>
    <div class="grid">
      <div class="frame active"><div class="img"></div><div class="cap">01 Atlas Route Planner</div></div>
      <div class="frame"><div class="img"></div><div class="cap">02 Harbor Ops Desk</div></div>
      <div class="frame"><div class="img"></div><div class="cap">Skills strip</div></div>
    </div>
    <div class="reticle"></div>
  </div>
</body>
</html>
<!-- post-serve -->
