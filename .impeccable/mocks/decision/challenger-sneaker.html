<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Archive Stack — first viewport</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1440px;height:900px;overflow:hidden;background:#2a211c;font-family:"IBM Plex Mono",monospace;color:#1a1410}
  .wall{padding:36px 48px;height:100%;display:flex;flex-direction:column;gap:28px}
  .top{display:flex;justify-content:space-between;align-items:baseline;color:#f0e6d8}
  .top h1{font-family:"Bebas Neue",sans-serif;font-size:56px;letter-spacing:.04em;line-height:1}
  .top p{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;max-width:320px;text-align:right}
  .stack{flex:1;display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:20px;align-items:end}
  .box{background:#c45a2c;border:2px solid #0e0a08;box-shadow:0 18px 0 #0e0a08;padding:22px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between}
  .box.pulled{transform:translateY(-48px);background:#d97840;min-height:520px}
  .box .sil{height:160px;border:1.5px dashed #0e0a08;opacity:.55}
  .box h2{font-family:"Bebas Neue",sans-serif;font-size:42px;letter-spacing:.03em;line-height:1}
  .box .meta{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .box.idle{background:#a84a24;min-height:360px;opacity:.92}
  .contact{color:#f0e6d8;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .contact a{color:#f0e6d8;margin-right:28px}
</style>
</head>
<body>
  <div class="wall">
    <header class="top">
      <h1>JNP / ARCHIVE</h1>
      <p>Full-stack systems<br/>Two boxes on the shelf · synthetic</p>
    </header>
    <div class="stack">
      <article class="box pulled">
        <div class="sil"></div>
        <div>
          <div class="meta">01 · Colorway Proof</div>
          <h2>Atlas Route Planner</h2>
        </div>
      </article>
      <article class="box idle">
        <div class="sil"></div>
        <div>
          <div class="meta">02</div>
          <h2>Harbor Ops Desk</h2>
        </div>
      </article>
      <article class="box idle" style="opacity:.55">
        <div class="sil"></div>
        <div>
          <div class="meta">Skills · Contact</div>
          <h2>Open lid →</h2>
        </div>
      </article>
    </div>
    <div class="contact">
      <a href="#">Email</a><a href="#">LinkedIn</a><a href="#">GitHub</a>
    </div>
  </div>
</body>
</html>
