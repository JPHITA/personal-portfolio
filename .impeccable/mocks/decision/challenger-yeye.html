<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Pop Sleeve — first viewport</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1440px;height:900px;overflow:hidden;background:#ff6b3d;font-family:"Fredoka",sans-serif;color:#fff}
  .sleeve{width:100%;height:100%;display:grid;grid-template-columns:1fr 520px;padding:48px 56px;gap:40px}
  .left{display:flex;flex-direction:column;justify-content:space-between}
  .logo{font-size:72px;font-weight:700;letter-spacing:-.02em;line-height:.95;max-width:700px}
  .role{font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
  .tracks{font-family:"IBM Plex Mono",monospace;font-size:15px;line-height:2}
  .tracks .on{background:#fff;color:#ff6b3d;padding:2px 10px}
  .portrait{background:linear-gradient(160deg,#ffe0d0,#c9785a 50%,#5a3a32);border-radius:8px;border:4px solid #fff;position:relative}
  .portrait span{position:absolute;left:24px;bottom:24px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:#fff;color:#ff6b3d;padding:6px 10px}
</style>
</head>
<body>
  <div class="sleeve">
    <div class="left">
      <div>
        <div class="role">Side A · Specialty</div>
        <h1 class="logo">Juan Nicolas Piedrahita</h1>
      </div>
      <div class="tracks">
        <div class="on">01 Atlas Route Planner</div>
        <div>02 Harbor Ops Desk</div>
        <div>03 Skills</div>
        <div>04 Contact · Email · LinkedIn · GitHub</div>
      </div>
    </div>
    <div class="portrait"><span>Portrait · synthetic</span></div>
  </div>
</body>
</html>
