<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Darkroom Bay — first viewport</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1440px;height:900px;overflow:hidden;background:#1a1008;font-family:"IBM Plex Mono",monospace;color:#f0c070}
  .bay{width:100%;height:100%;background:radial-gradient(ellipse at 50% 0%,#5a3010 0%,#1a1008 55%);padding:40px 52px;display:grid;grid-template-rows:auto 1fr auto;gap:24px}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  .top h1{font-family:"Special Elite",serif;font-size:40px;color:#ffb84d}
  .top span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  .tray{background:#0d0a06;border:2px solid #c4843a;padding:28px;display:grid;grid-template-columns:1.4fr .6fr;gap:28px;align-items:stretch}
  .print{background:linear-gradient(180deg,#2a2a2a,#0a0a0a 30%,#3a3a3a 55%,#111);border:1px solid #8a6020;position:relative;min-height:480px}
  .print::after{content:"DEVELOPING";position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:13px;letter-spacing:.2em;opacity:.35}
  .side{display:flex;flex-direction:column;justify-content:space-between}
  .side h2{font-family:"Special Elite",serif;font-size:28px;color:#ffb84d;line-height:1.2}
  .side p{font-size:13px;line-height:1.5;opacity:.85;margin-top:16px}
  .side .links a{display:block;color:#ffb84d;margin-top:10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .timer{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.65;border-top:1px solid #8a6020;padding-top:16px}
</style>
</head>
<body>
  <div class="bay">
    <header class="top">
      <h1>J.N. Piedrahita — proof bay</h1>
      <span>Safelight · synthetic print 01</span>
    </header>
    <section class="tray">
      <div class="print"></div>
      <aside class="side">
        <div>
          <h2>Atlas Route Planner</h2>
          <p>Work emerges first. Specialty and contact wait at the tray edge until the print holds.</p>
          <div class="links">
            <a href="#">Email</a>
            <a href="#">LinkedIn</a>
            <a href="#">GitHub</a>
          </div>
        </div>
        <div class="timer">Timer 01:12 · Skills strip below</div>
      </aside>
    </section>
    <div class="timer">Projects develop as prints · detail routes open the full sheet</div>
  </div>
</body>
</html>
