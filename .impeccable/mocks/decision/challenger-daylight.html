<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Daylight Section — first viewport</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1440px;height:900px;overflow:hidden;background:#f4f1ea;font-family:"IBM Plex Mono",monospace;color:#1c1a16}
  .section{width:100%;height:100%;position:relative;background:linear-gradient(90deg,#ebe6dc 0%,#ebe6dc 42%,#f7f4ee 42%,#f7f4ee 100%)}
  .poche{position:absolute;left:0;top:0;bottom:0;width:42%;background:#1c1a16}
  .beam{position:absolute;left:28%;top:0;width:38%;height:100%;background:linear-gradient(105deg,transparent 0%,rgba(232,196,90,.55) 35%,rgba(232,196,90,.15) 70%,transparent 100%);pointer-events:none}
  .room{position:absolute;left:46%;top:80px;right:56px;bottom:80px;display:grid;grid-template-rows:auto 1fr auto;gap:24px}
  .room h1{font-size:14px;letter-spacing:.16em;text-transform:uppercase}
  .room h1 span{display:block;font-family:"Archivo Narrow",sans-serif;font-size:56px;font-weight:700;letter-spacing:-.02em;text-transform:none;margin-top:8px;line-height:1;transform:skewX(-6deg)}
  .plate{background:linear-gradient(160deg,#3a4550,#8a96a2);border:1px solid #1c1a16;min-height:380px}
  .annot{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .annot a{color:#1c1a16;margin-left:20px}
  .time{position:absolute;left:24px;bottom:40px;color:#f4f1ea;font-size:12px;letter-spacing:.14em;writing-mode:vertical-rl;transform:rotate(180deg)}
</style>
</head>
<body>
  <div class="section">
    <div class="poche"></div>
    <div class="beam"></div>
    <div class="time">08:12 · useful light</div>
    <div class="room">
      <h1>Occupation · Project 01<span>Atlas Route Planner</span></h1>
      <div class="plate"></div>
      <div class="annot">
        <span>Specialty gathers at the warm edge · synthetic</span>
        <div><a href="#">Email</a><a href="#">LinkedIn</a><a href="#">GitHub</a></div>
      </div>
    </div>
  </div>
</body>
</html>
<!-- post-serve -->
